<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WC2026 Guide - Offline</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #1a237e; color: white; }
        .container { text-align: center; padding: 40px; max-width: 500px; }
        h1 { font-size: 2rem; margin-bottom: 20px; }
        p { font-size: 1.1rem; line-height: 1.6; opacity: 0.9; }
        .icon { font-size: 4rem; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📡</div>
        <h1>You're Offline</h1>
        <p>Some features may be unavailable without an internet connection. Cached content is still accessible.</p>
        <p style="margin-top: 20px; font-size: 0.9rem; opacity: 0.7;">Please connect to the internet for the full experience.</p>
    </div>
</body>
</html>
