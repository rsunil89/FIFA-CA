<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FIFA World Cup 2026 Tourist Guide for Canada, USA, and Mexico.">
    <meta name="theme-color" content="#1a237e">

    <link rel="manifest" href="%BASE_URL%manifest.json">

    <title>World Cup 2026 Tourist Guide</title>

    <script
        async
        defer
        src="https://maps.googleapis.com/maps/api/js?key=%VITE_GOOGLE_MAPS_API_KEY%&libraries=places">
    </script>
</head>
<body>
    <div id="root"></div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register(`${import.meta?.env?.BASE_URL || '/'}sw_offline_first.js`)
                    .catch(error => console.log('Service Worker registration failed:', error));
            });
        }
    </script>

    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
