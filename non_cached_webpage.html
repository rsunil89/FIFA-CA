<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WC2026 Guide - Non-Cached Page</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #f4f4f4; }
        .container { text-align: center; padding: 40px; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 500px; }
        h1 { color: #1a237e; }
        p { color: #666; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚽ Non-Cached Page</h1>
        <p>This page is intentionally not cached by the service worker. It demonstrates the PWA's ability to selectively cache content.</p>
        <p><a href="index.html" style="color: #ff6f00; font-weight: 600;">Return to Main App</a></p>
    </div>
</body>
</html>
